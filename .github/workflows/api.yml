name: API lookup

# Prints the signatures of Minecraft / library classes as this project compiles against them (Mojang names), for writing mixins.
on:
  workflow_dispatch:
    inputs:
      classes:
        description: 'Space-separated class names, e.g. com.mojang.blaze3d.platform.Window'
        required: true
      list:
        description: 'Optional regex: list the class files in the game jars whose path matches it'
        required: false
        default: ''

jobs:
  javap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve the game's classes
        run: ./gradlew :mod:compileJava -x compileNative --stacktrace || true
      - name: javap
        env:
          CLASSES: ${{ inputs.classes }}
          LIST: ${{ inputs.list }}
        run: |
          CP=$(find ~/.gradle/caches .gradle mod/.gradle -name '*.jar' \( -path '*minecraft*' -o -path '*blaze3d*' -o -path '*lwjgl*' \) 2>/dev/null | tr '\n' ':')
          if [ -n "$LIST" ]; then
            for j in $(echo "$CP" | tr ':' ' '); do case "$j" in *minecraft*) unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -E "$LIST" | grep -v '\$[0-9]' ;; esac; done | sort -u | head -400
          fi
          for c in $CLASSES; do echo "===== $c"; javap -p -cp "$CP" "$c" || echo "not found: $c"; done
