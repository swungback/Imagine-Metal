name: Dump game files

# Prints files from the game jars (shaders, json) whose path matches a regex, for reading what the game ships.
on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Regex of paths inside the game jars to print'
        required: true

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve the game
        run: ./gradlew :mod:compileJava -x compileNative --stacktrace || true
      - name: Print
        env:
          FILES: ${{ inputs.files }}
        run: |
          mkdir -p out
          for j in $(find ~/.gradle/caches .gradle mod/.gradle -name '*.jar' -path '*minecraft*' 2>/dev/null); do
            for f in $(unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -E "$FILES"); do
              echo "===== $j :: $f"; unzip -p "$j" "$f"; echo
            done
          done
