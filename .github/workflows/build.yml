name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  jar:
    # Apple Silicon: the Metal library (Objective-C, linked against Metal) only builds on macOS
    # (the Intel runners: the Apple Silicon ones have been at capacity; the library is cross-built for arm64 either way)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # The game compiles its Metal shaders at runtime: compile them here too, so a shader error fails the build instead of the game
      - name: Check the Metal shaders
        run: |
          xcrun -sdk macosx metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          R=mod/src/main/resources
          mkdir -p build/msl
          # as the game builds it: the indie profile's defines, our lighting before mcopt's terrain, our shadow casters after it
          { echo '#define OWN_EXACT_POS 1'; echo '#define OWN_QREC 1'; echo '#define IM_SHADE 1'; cat $R/imaginemetal/shaders/lighting.metal; echo
            cat $R/mcopt/own/terrain.metal; echo; cat $R/imaginemetal/shaders/shadow.metal; } > build/msl/terrain_im.metal
          xcrun -sdk macosx metal -std=metal3.1 -c build/msl/terrain_im.metal -o build/msl/terrain_im.air
          { echo '#define IM_SHADE 1'; cat $R/imaginemetal/shaders/lighting.metal; echo
            cat $R/mcopt/own/terrain.metal; echo; cat $R/imaginemetal/shaders/shadow.metal; } > build/msl/terrain_im_plain.metal
          xcrun -sdk macosx metal -std=metal3.1 -c build/msl/terrain_im_plain.metal -o build/msl/terrain_im_plain.air
          xcrun -sdk macosx metal -std=metal3.1 -c $R/mcopt/own/terrain.metal -o build/msl/terrain.air
          xcrun -sdk macosx metal -std=metal3.0 -c $R/imaginemetal/shaders/bloom.metal -o build/msl/bloom.air
          xcrun -sdk macosx metal -std=metal3.0 -c $R/imaginemetal/shaders/light.metal -o build/msl/light.air
          { cat $R/imaginemetal/shaders/lighting.metal; echo; cat $R/imaginemetal/shaders/sky.metal; } > build/msl/sky.metal
          xcrun -sdk macosx metal -std=metal3.0 -c build/msl/sky.metal -o build/msl/sky.air
          # Minecraft's entity, item and particle shaders with our lighting patched in (imaginemetal.EntityShade)
          python3 ci/entity_check.py $R build/msl/entity
          for f in build/msl/entity/*.metal; do xcrun -sdk macosx metal -std=metal3.0 -c "$f" -o "$f.air"; done
          echo "Metal shaders compile"

      - name: Build the mod
        run: ./gradlew :mod:build --stacktrace

      - name: Find the jar
        id: jar
        run: |
          JAR=$(find mod/build/libs -name 'imagine-metal-*.jar' ! -name '*-sources.jar' | head -1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Built $JAR"
          unzip -l "$JAR" | grep -E 'fabric.mod.json|libmcmetal.dylib|META-INF/mcopt|imaginemetal/'

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: imagine-metal
          path: |
            mod/build/libs/imagine-metal-*.jar
            !mod/build/libs/*-sources.jar
          if-no-files-found: error

      # The newest jar from main, always at the same place: Releases > Dev build
      - name: Publish the dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev "${{ steps.jar.outputs.path }}" --prerelease --target "$GITHUB_SHA" \
            --title "Dev build" --notes "Newest build of main ($(git rev-parse --short HEAD)). Put the jar in the mods folder of a Fabric 26.3 instance."
