name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar:
    # Apple Silicon: the Metal library (Objective-C, linked against Metal) only builds on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: ./gradlew :mod:build --stacktrace

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: imagine-metal
          path: |
            mod/build/libs/imagine-metal-*.jar
            !mod/build/libs/*-sources.jar
          if-no-files-found: error
